name: update-prices
on:
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Collect (CI-safe methods only)
        env:
          CNY_USD_RATE: "0.14"
        run: node scripts/collect.js --method direct-api,public-page
      - name: Commit
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "bot@langmart.ai"
          git add data PRICES.md
          git diff --cached --quiet || git commit -m "prices: automated update $(date -u +%F)"
          git push
